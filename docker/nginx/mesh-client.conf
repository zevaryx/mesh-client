# HTTPS in front of the headless web UI (compose.yaml, profile "https").
# The certificate is created by 10-mesh-client-self-signed-cert.sh on first start.

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 443 ssl;
  http2 on;

  ssl_certificate     /etc/nginx/tls/mesh-client.crt;
  ssl_certificate_key /etc/nginx/tls/mesh-client.key;
  ssl_protocols       TLSv1.2 TLSv1.3;

  # Match MESH_CLIENT_WEB_MAX_UPLOAD_MB (default 64).
  client_max_body_size 64m;

  location / {
    proxy_pass http://mesh-client:8080;
    proxy_http_version 1.1;
    # $http_host keeps the port: the server compares the WebSocket's Origin with Host.
    proxy_set_header Host $http_host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # The bridge WebSocket stays open for as long as the tab is.
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
  }
}
